[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Ilova bitta sahifadan iborat — har qanday yo'l index.html ga yo'naltiriladi
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# public/ ichidagi fayllar nomiga hash qo'shilmaydi, shuning uchun ularni
# "immutable" deb bo'lmaydi. Netlify'ning sukutdagi qiymati esa
# `max-age=0, must-revalidate` — ya'ni har bir ochilishda brauzer har bir
# rasm va video uchun serverga qayta murojaat qiladi (sahifa "qaytadan
# yuklanayotgandek" ko'rinishining asosiy sababi shu).
# Yechim: qisqa muddatli kesh + fonda yangilash.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Videolar og'ir va deyarli o'zgarmaydi — bir yil saqlanadi.
#
# `immutable` shart: usiz brauzer sahifa yangilanganda (F5) `max-age` ni
# e'tiborsiz qoldirib, har bir video uchun revalidate so'rovi yuboradi —
# aynan shu "videolar yana boshidan yuklanmoqda" hissini berardi.
#
# Fayl nomiga hash qo'shilmagani uchun buning narxi bor: videoni almashtirsangiz
# brauzer eskisini ko'rsatishda davom etadi. Yechim — yangi faylni boshqa nom
# bilan qo'yish (masalan `intro-building-2.mp4`) va `heroMedia.ts` da yo'lni
# yangilash.
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
